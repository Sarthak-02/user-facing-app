runtime: nodejs22
service: user-facing-app

instance_class: F1

automatic_scaling:
  min_idle_instances: 1
  max_idle_instances: 1
  min_pending_latency: 3000ms
  max_pending_latency: automatic
  max_concurrent_requests: 80

handlers:
  # -----------------------------
  # Static Assets (JS/CSS)
  # -----------------------------
  - url: /app/assets/(.*\.js)
    static_files: dist/assets/\1
    upload: dist/assets/.*\.js$
    mime_type: application/javascript
    secure: always

  - url: /app/assets/(.*\.mjs)
    static_files: dist/assets/\1
    upload: dist/assets/.*\.mjs$
    mime_type: application/javascript
    secure: always

  - url: /app/assets/(.*\.css)
    static_files: dist/assets/\1
    upload: dist/assets/.*\.css$
    mime_type: text/css
    secure: always

  # -----------------------------
  # Images / Icons
  # -----------------------------
  - url: /app/(.*\.(png|jpg|jpeg|gif|svg|webp|ico))
    static_files: dist/\1
    upload: dist/.*\.(png|jpg|jpeg|gif|svg|webp|ico)$
    secure: always

  # -----------------------------
  # Service Worker + Manifest
  # -----------------------------
  - url: /app/sw.js
    static_files: dist/sw.js
    upload: dist/sw.js
    mime_type: application/javascript
    secure: always

  - url: /app/manifest.webmanifest
    static_files: dist/manifest.webmanifest
    upload: dist/manifest.webmanifest
    mime_type: application/manifest+json
    secure: always

  # -----------------------------
  # SPA Fallback → index.html
  # -----------------------------
  - url: /app/.*
    static_files: dist/index.html
    upload: dist/index.html
    secure: always

